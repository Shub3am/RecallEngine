[project]
name = "recall-engine"
version = "0.1.0"
description = "Keyword, boolean and BM25/TF-IDF search over JSON documents from a single import."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nltk>=3.9.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "datasets>=4.7.0,<5.0.0",
]

[project.scripts]
recall_engine = "recall_engine.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks slower integration/performance tests",
]
