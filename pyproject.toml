[project]
name = "recall-engine"
version = "0.1.0"
description = "Add your description here"

readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nltk==3.9.1",
    "pytest (>=9.0.2,<10.0.0)",
    "datasets (>=4.7.0,<5.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.poetry]
packages = [
    { include = "recall_engine" }
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"

[project.scripts]
recall_engine = "recall_engine.cli.main:cli"

[tool.pytest.ini_options]
markers = [
    "slow: marks slower integration/performance tests",
]