[project]
name = "recall-engine"
version = "1.2.1"
description = "Keyword, boolean, BM25/TF-IDF, semantic and hybrid search, plus cited answers from Claude, over files, folders and databases from a single import."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "nltk>=3.9.1,<4",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.8.0,<1",
    "numpy>=2",
]
api = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.53",
]
formats = [
    "pypdf>=6.19,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
]
database = [
    "sqlalchemy>=2.1,<3",
]
rag = [
    "anthropic>=1.9,<2",
]
all = [
    "recall-engine[semantic,api,formats,database,rag]",
]
dev = [
    "recall-engine[all]",
    "httpx2",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "datasets>=4.7.0,<5.0.0",
]

[project.scripts]
recall_engine = "recall_engine.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks slower integration/performance tests",
]
